<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6a00'/%3E%3Ctext x='10' y='44' font-size='29' font-family='Arial' font-weight='bold' fill='white'%3EXP%3C/text%3E%3C/svg%3E"><title>XPlanet 乐购商城</title><style>
:root{--orange:#ff6a00;--ink:#242424;--muted:#727272;--bg:#f5f5f5;--line:#eee;--red:#d94444;--green:#15805b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.top{height:34px;background:#f5f5f5;color:#666;font-size:12px}.topin,.navin,.content{max-width:1200px;margin:auto}.topin{height:100%;display:flex;align-items:center;justify-content:flex-end;gap:16px}.nav{height:78px;background:#fff;border-bottom:1px solid var(--line)}.navin{height:100%;display:flex;align-items:center;gap:27px}.logo{font:bold 27px Georgia;color:#111;white-space:nowrap}.logo b{color:var(--orange)}.navlinks{display:flex;gap:24px;font-weight:bold}.navlinks a{cursor:pointer}.navlinks a:hover{color:var(--orange)}.search{height:42px;display:flex;flex:1;max-width:480px;margin-left:auto}.search input{min-width:0;flex:1;border:2px solid var(--orange);padding:0 13px;outline:0}.search button{width:74px;background:var(--orange);color:#fff;font-weight:bold}.cartbtn{position:relative;padding:10px 16px;background:#fff7f0;border:1px solid #ffcfad;color:var(--orange);border-radius:3px}.badge{position:absolute;top:-8px;right:-7px;min-width:19px;height:19px;padding:2px 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px}.content{padding:20px 0 55px}.hero{height:260px;padding:43px 54px;border-radius:10px;background:linear-gradient(110deg,#321100,#e74f00 58%,#ffb016);color:#fff;overflow:hidden;position:relative}.hero:after{content:'秒';position:absolute;right:48px;bottom:-88px;font:bold 270px Georgia;color:#fff2;line-height:1}.hero h1{font-size:38px;margin:10px 0}.hero p{font-size:16px;opacity:.9}.hero button{margin-top:17px;padding:11px 26px;border-radius:3px;background:#fff;color:#e64b00;font-weight:bold}.features{background:#fff;margin:16px 0;padding:18px 26px;display:flex;justify-content:space-around;color:#555}.features b{color:#111;margin-right:7px}.section{background:#fff;margin-top:18px;padding:22px}.section-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:16px}.section-head h2{font-size:22px;margin:0}.section-head h2:before{content:'';display:inline-block;width:5px;height:22px;background:var(--orange);vertical-align:-4px;margin-right:9px}.cats{display:flex;gap:10px}.cat{padding:6px 13px;background:#f7f7f7;border-radius:16px;cursor:pointer}.cat.active,.cat:hover{background:#fff0e5;color:var(--orange)}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.product{border:1px solid #f0f0f0;padding:16px;transition:.18s;background:#fff}.product:hover{border-color:#ffbe91;box-shadow:0 7px 20px #0000000d;transform:translateY(-2px)}.cover{height:118px;background:linear-gradient(135deg,#fff2e8,#ffe0c4);display:grid;place-items:center;font-size:58px}.product h3{margin:13px 0 7px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:#888;font-size:12px;height:31px;line-height:16px}.price{color:var(--red);font:bold 22px Arial;margin:11px 0}.price small{font-size:12px}.product-foot{display:flex;align-items:center;justify-content:space-between;color:#999;font-size:12px}.add{padding:7px 11px;background:var(--orange);color:white;border-radius:2px}.flash{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.flashcard{border:1px solid #ffe0c4;background:linear-gradient(120deg,#fffaf6,#fff);padding:18px}.flashcard b{color:var(--red);font-size:22px}.flashcard h3{margin:10px 0}.flashcard button{margin-top:13px;padding:9px 18px;background:#d94444;color:#fff;border-radius:2px}.drawer{position:fixed;z-index:10;right:-440px;top:0;width:410px;max-width:100%;height:100vh;background:#fff;box-shadow:-8px 0 30px #0003;transition:.25s;padding:22px;display:flex;flex-direction:column}.drawer.open{right:0}.drawer h2{margin:0}.drawer-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.close{font-size:27px;background:none;color:#888}.cartlist{overflow:auto;flex:1}.cartrow{display:grid;grid-template-columns:45px 1fr auto;gap:10px;padding:15px 0;border-bottom:1px solid #eee}.cartcover{font-size:31px}.cartname{font-weight:bold}.cartsub{color:#999;font-size:12px;margin-top:5px}.qty{margin-top:9px;display:flex;align-items:center;gap:7px}.qty button{width:22px;height:22px;background:#f3f3f3}.cartbottom{border-top:1px solid var(--line);padding-top:16px}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;margin-bottom:13px}.checkout{width:100%;padding:13px;background:var(--orange);color:#fff;font-weight:bold;font-size:16px}.overlay{position:fixed;z-index:20;inset:0;background:#0008;display:grid;place-items:center}.auth{background:#fff;width:390px;max-width:calc(100% - 30px);padding:30px;border-radius:8px}.auth h1{margin:0 0 8px}.auth p{color:#888}.auth input{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;outline-color:var(--orange)}.auth button{width:100%;padding:12px;margin-top:10px;background:var(--orange);color:#fff;font-weight:bold}.auth .switch{background:#fff;color:#666;border:1px solid #ddd}.hidden{display:none!important}.modal{position:fixed;z-index:15;inset:0;background:#0007;display:grid;place-items:center}.modalbox{max-height:80vh;overflow:auto;background:#fff;width:680px;max-width:94%;padding:25px;border-radius:8px}.order{border-bottom:1px solid #eee;padding:14px 0}.order:last-child{border:0}.order h4{margin:0 0 8px}.toast{position:fixed;z-index:30;bottom:28px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#222;color:#fff;border-radius:4px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.empty{color:#999;text-align:center;padding:50px 10px}@media(max-width:780px){.nav{height:auto;padding:12px}.navin{flex-wrap:wrap}.navlinks{order:3;width:100%}.search{order:2;margin:0;width:100%;max-width:none}.content{padding:12px}.hero{height:210px;padding:28px}.hero h1{font-size:27px}.products{grid-template-columns:repeat(2,1fr)}.flash{grid-template-columns:1fr}.features{display:none}.top{display:none}}
</style></head><body>
<div id="authOverlay" class="overlay"><div class="auth"><h1>XPlanet 乐购</h1><p id="authIntro">登录后即可浏览商品、管理购物车与参与限量秒杀。</p><input id="username" placeholder="账号" value="alice"><input id="nickname" class="hidden" placeholder="昵称（注册可选）"><input id="password" placeholder="密码" value="password" type="password"><button id="authSubmit">登录</button><button id="authSwitch" class="switch">没有账号？立即注册</button></div></div>
<div id="app" class="hidden"><div class="top"><div class="topin"><span id="welcome"></span><a onclick="showOrders()">我的订单</a><a onclick="logout()">退出登录</a></div></div><header class="nav"><div class="navin"><div class="logo">X<b>Planet</b> 乐购</div><nav class="navlinks"><a onclick="scrollTo({top:0,behavior:'smooth'})">首页</a><a onclick="document.getElementById('goods').scrollIntoView({behavior:'smooth'})">商品</a><a onclick="document.getElementById('flash').scrollIntoView({behavior:'smooth'})">限量秒杀</a></nav><div class="search"><input id="searchInput" placeholder="搜索商品，例如：耳机、键盘"><button onclick="searchProducts()">搜索</button></div><button class="cartbtn" onclick="openCart()">🛒 购物车 <span id="cartBadge" class="badge">0</span></button></div></header><main class="content"><section class="hero"><div>XP SELECTED MARKET</div><h1>好物随心选，限量安心购</h1><p>正常商品即时结算；限量活动采用可靠异步下单，订单状态可追踪。</p><button onclick="document.getElementById('goods').scrollIntoView({behavior:'smooth'})">开始逛逛</button></section><div class="features"><span><b>✓ 正品保障</b>精选商品</span><span><b>✓ 安全结算</b>订单事务一致</span><span><b>✓ 限量秒杀</b>库存原子准入</span><span><b>✓ 订单可查</b>状态全程可追踪</span></div><section id="goods" class="section"><div class="section-head"><h2>精选商品</h2><div class="cats"><span class="cat active" data-cat="全部" onclick="selectCategory(this)">全部</span><span class="cat" data-cat="数码" onclick="selectCategory(this)">数码</span><span class="cat" data-cat="生活" onclick="selectCategory(this)">生活</span><span class="cat" data-cat="出行" onclick="selectCategory(this)">出行</span></div></div><div id="products" class="products"></div></section><section id="flash" class="section"><div class="section-head"><h2>限量秒杀专区</h2><span style="color:#d94444">Redis 原子库存准入 · 异步订单创建</span></div><div id="activities" class="flash"></div></section></main></div>
<aside id="cartDrawer" class="drawer"><div class="drawer-head"><h2>购物车</h2><button class="close" onclick="closeCart()">×</button></div><div id="cartList" class="cartlist"></div><div class="cartbottom"><div class="total"><span>合计</span><span id="cartTotal">¥0.00</span></div><button class="checkout" onclick="checkout()">提交订单（模拟支付）</button></div></aside><div id="modal" class="modal hidden"><div class="modalbox"><button class="close" style="float:right" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast"></div>
<script>
const userApi='http://localhost:8083',mallApi='http://localhost:8080';let token=localStorage.getItem('xp_token')||'',profile=JSON.parse(localStorage.getItem('xp_profile')||'null'),category='全部',registerMode=false;
const $=id=>document.getElementById(id),money=v=>'¥'+Number(v).toFixed(2),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
async function api(base,path,opt={}){const r=await fetch(base+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}}),b=await r.json().catch(()=>({msg:'服务响应异常'}));if(!r.ok||b.code!==0)throw Error(b.msg||'请求失败');return b.data}
function setSession(d){token=d.token;profile={nickname:d.nickname,userId:d.userId};localStorage.setItem('xp_token',token);localStorage.setItem('xp_profile',JSON.stringify(profile));$('authOverlay').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='你好，'+profile.nickname;loadAll()}function logout(){localStorage.removeItem('xp_token');localStorage.removeItem('xp_profile');token='';profile=null;$('app').classList.add('hidden');$('authOverlay').classList.remove('hidden');closeCart()}
$('authSwitch').onclick=()=>{registerMode=!registerMode;$('nickname').classList.toggle('hidden',!registerMode);$('authSubmit').textContent=registerMode?'注册并登录':'登录';$('authSwitch').textContent=registerMode?'已有账号？返回登录':'没有账号？立即注册';$('authIntro').textContent=registerMode?'注册后将自动登录并进入商城。':'登录后即可浏览商品、管理购物车与参与限量秒杀。'};$('authSubmit').onclick=async()=>{try{const d=registerMode?await api(userApi,'/api/user/register',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,nickname:$('nickname').value})}):await api(userApi,'/api/user/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});setSession(d);toast('欢迎来到 XPlanet 乐购')}catch(e){toast(e.message)}};
async function loadAll(){await Promise.all([loadProducts(),loadActivities(),loadCart()])}async function loadProducts(){try{const qs=new URLSearchParams(),k=$('searchInput')?.value||'';if(k)qs.set('keyword',k);if(category!=='全部')qs.set('category',category);const rows=await api(mallApi,'/api/mall/products?'+qs);$('products').innerHTML=rows.map(p=>`<article class="product"><div class="cover">${esc(p.cover)}</div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.subtitle)}</div><div class="price"><small>¥</small>${Number(p.price).toFixed(2)}</div><div class="product-foot"><span>已售 ${p.sales} · 库存 ${p.stock}</span><button class="add" onclick="addCart('${p.id}')">加入购物车</button></div></article>`).join('')||'<p class="empty">没有找到相关商品</p>'}catch(e){toast('商品加载失败：'+e.message)}}function searchProducts(){loadProducts()}function selectCategory(el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');category=el.dataset.cat;loadProducts()}async function addCart(id){try{await api(mallApi,'/api/mall/cart',{method:'POST',body:JSON.stringify({productId:id,quantity:1})});await loadCart();toast('已加入购物车')}catch(e){toast(e.message)}}
async function loadCart(){if(!token)return;try{const c=await api(mallApi,'/api/mall/cart');$('cartBadge').textContent=c.totalQuantity||0;$('cartTotal').textContent=money(c.totalAmount);$('cartList').innerHTML=(c.items||[]).map(x=>`<div class="cartrow"><div class="cartcover">${esc(x.cover)}</div><div><div class="cartname">${esc(x.name)}</div><div class="cartsub">${money(x.price)} · 库存 ${x.stock}</div><div class="qty"><button onclick="changeQty('${x.productId}',${x.quantity-1})">−</button><b>${x.quantity}</b><button onclick="changeQty('${x.productId}',${x.quantity+1})">＋</button></div></div><b style="color:#d94444">${money(x.subtotal)}</b></div>`).join('')||'<p class="empty">购物车还是空的<br>去挑选喜欢的商品吧</p>'}catch(e){toast(e.message)}}function openCart(){$('cartDrawer').classList.add('open');loadCart()}function closeCart(){$('cartDrawer').classList.remove('open')}async function changeQty(id,q){try{await api(mallApi,'/api/mall/cart/'+id,{method:'PUT',body:JSON.stringify({quantity:q})});loadCart()}catch(e){toast(e.message)}}
async function checkout(){try{const o=await api(mallApi,'/api/mall/orders/checkout',{method:'POST'});closeCart();await loadProducts();await loadCart();toast('订单创建成功，已完成模拟支付');showOrder(o)}catch(e){toast(e.message)}}async function showOrders(){try{const rows=await api(mallApi,'/api/mall/orders');$('modalContent').innerHTML='<h2>我的订单</h2>'+(rows.map(orderHtml).join('')||'<p class="empty">暂无订单</p>');$('modal').classList.remove('hidden')}catch(e){toast(e.message)}}function showOrder(o){$('modalContent').innerHTML='<h2>下单成功</h2>'+orderHtml(o);$('modal').classList.remove('hidden')}function orderHtml(o){return `<div class="order"><h4>订单 #${esc(o.orderNo)}</h4><div>${(o.items||[]).map(i=>esc(i.productName)+' × '+i.quantity).join('，')}</div><p>支付状态：<b style="color:#15805b">${o.status==='PAID'?'已支付（模拟）':esc(o.status)}</b>　合计 <b style="color:#d94444">${money(o.totalAmount)}</b></p></div>`}function closeModal(){$('modal').classList.add('hidden')}
async function loadActivities(){try{const rows=await api(mallApi,'/api/seckill/activities');$('activities').innerHTML=rows.map(a=>`<article class="flashcard"><div>活动 #${a.id} · 可用库存 ${a.availableStock}/${a.totalStock}</div><h3>${esc(a.title)}</h3><b>限量抢购</b><p>下单后进入可靠队列，订单状态异步确认。</p><button onclick="seckill('${a.id}')">立即秒杀</button></article>`).join('')||'<p class="empty">当前暂无秒杀活动</p>'}catch(e){toast('秒杀活动加载失败：'+e.message)}}async function seckill(id){try{const r=await api(mallApi,'/api/seckill/activities/'+id+'/orders',{method:'POST'});toast(r.message||'已受理秒杀请求');if(r.requestId)pollSeckill(r.requestId)}catch(e){toast(e.message)}}async function pollSeckill(id){for(let n=0;n<15;n++){await new Promise(r=>setTimeout(r,700));try{const x=await api(mallApi,'/api/seckill/requests/'+id);if(x.status!=='QUEUED'){toast(x.status==='SUCCEEDED'?'秒杀订单创建成功':'秒杀失败：'+(x.failReason||''));loadActivities();return}}catch(e){toast(e.message);return}}toast('订单仍在排队，可稍后再次查看')}
if(token&&profile){$('authOverlay').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='你好，'+profile.nickname;loadAll()}
</script></body></html>
