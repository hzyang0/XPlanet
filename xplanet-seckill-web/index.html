<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XPlanet Flash Sale</title><style>
:root{--ink:#16251f;--muted:#6a776f;--paper:#fbfaf6;--line:#dde3dc;--green:#17624e;--mint:#eaf4ee;--red:#b4433d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#f6f5f0,#edf5f0);font-family:ui-sans-serif,system-ui,"Microsoft YaHei";color:var(--ink)}header{padding:26px max(6vw,24px);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:#ffffffbf;backdrop-filter:blur(8px)}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{font-family:Georgia,serif;font-size:24px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px;letter-spacing:1px}main{max-width:1160px;margin:32px auto;padding:0 24px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;padding:32px;border-radius:22px;background:linear-gradient(120deg,#fff,#e8f5ef);border:1px solid #dce9e1}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:800}.hero h2{font:700 42px/1.15 Georgia,"Microsoft YaHei";margin:10px 0}.hero p{color:var(--muted);margin:0}.status{padding:10px 14px;border-radius:99px;background:#fff;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:330px 1fr;gap:22px;margin-top:22px}.panel,.activity{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px #31502a0a}.panel h3{font:700 20px Georgia;margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 14px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.ghost{background:var(--mint);color:var(--green);margin-left:8px}.activities{display:grid;gap:14px}.activity{display:grid;grid-template-columns:1fr auto;align-items:center}.activity h3{margin:4px 0 8px;font-size:22px}.meta{display:flex;gap:10px;color:var(--muted);font-size:13px}.stock{font:700 28px Georgia;color:var(--green);text-align:right}.stock small{display:block;color:var(--muted);font:12px ui-sans-serif}.result{margin-top:18px;padding:16px;border-radius:12px;background:#f6f8f6;font-size:14px;min-height:52px}.ok{color:var(--green)}.bad{color:var(--red)}.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:15px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h2{font-size:32px}.activity{grid-template-columns:1fr}.stock{text-align:left;margin-top:12px}}
</style></head><body><header><div class="brand"><div class="mark">XP</div><div><h1>XPlanet Flash Sale</h1><p>RELIABLE · ASYNC · TRACEABLE</p></div></div><span id="topStatus" class="status">未登录</span></header><main><section class="hero"><div><div class="eyebrow">HIGH CONCURRENCY ORDER LAB</div><h2>限量商品，可靠排队下单</h2><p>Redis Lua 原子准入 · Outbox 可靠投递 · RocketMQ 异步创建订单</p></div><span class="status" id="health">检查服务中…</span></section><section class="grid"><aside class="panel"><h3>账号登录</h3><div class="field"><label>账号</label><input id="username" value="alice"></div><div class="field"><label>密码（演示环境）</label><input id="password" value="password" type="password"></div><button id="login">登录</button><button id="warm" class="ghost" disabled>预热活动</button><p class="note">登录后可提交秒杀请求。预热会把数据库可用库存加载进 Redis；接口响应“排队中”不代表订单已成功，请观察下方状态。</p><div id="result" class="result">请先登录。</div></aside><section class="panel"><h3>进行中的秒杀活动</h3><div id="activities" class="activities"><p class="note">正在加载活动…</p></div></section></section></main><script>
const sale='http://localhost:8080',user='http://localhost:8083';let token='',lastRequest=null;const $=id=>document.getElementById(id);const result=(t,c='')=>{$('result').className='result '+c;$('result').textContent=t};
async function api(base,path,opt={}){const r=await fetch(base+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const j=await r.json();if(!r.ok||j.code!==0)throw Error(j.msg||'请求失败');return j.data}
async function load(){try{const list=await api(sale,'/api/seckill/activities');$('health').textContent='服务在线';$('activities').innerHTML=list.map(a=>`<article class="activity"><div><div class="eyebrow">ACTIVITY #${a.id}</div><h3>${a.title}</h3><div class="meta"><span>SKU ${a.skuId}</span><span>库存 ${a.availableStock}/${a.totalStock}</span></div></div><div class="stock"><span id="stock-${a.id}">${a.availableStock}</span><small>可用库存</small><button ${token?'':'disabled'} onclick="buy(${a.id})">立即秒杀</button></div></article>`).join('')}catch(e){$('health').textContent='服务异常';$('activities').innerHTML='<p class="bad">活动加载失败：'+e.message+'</p>'}}
async function buy(id){try{const d=await api(sale,`/api/seckill/activities/${id}/orders`,{method:'POST'});lastRequest=d.requestId;result(`${d.message}（状态：${d.status}）`,'ok');if(d.requestId)poll(d.requestId)}catch(e){result('下单失败：'+e.message,'bad')}}
async function poll(id){for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,800));try{const d=await api(sale,`/api/seckill/requests/${id}`);result(`请求 #${d.requestId}：${d.status}${d.orderId?'，订单 #'+d.orderId:''}${d.failReason?'，原因：'+d.failReason:''}`,d.status==='SUCCEEDED'?'ok':d.status==='FAILED'?'bad':'');if(d.status!=='QUEUED'){load();return}}catch(e){result('状态查询失败：'+e.message,'bad');return}}}
$('login').onclick=async()=>{try{const d=await api(user,'/api/user/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=d.token;$('topStatus').textContent='已登录：'+d.nickname;$('warm').disabled=false;result('登录成功，可预热并参与秒杀。','ok');load()}catch(e){result('登录失败：'+e.message,'bad')}};
$('warm').onclick=async()=>{try{await api(sale,'/api/seckill/admin/activities/1/warmup',{method:'POST'});result('活动已预热：Redis 库存已同步。','ok');load()}catch(e){result('预热失败：'+e.message,'bad')}};
load();
</script></body></html>
