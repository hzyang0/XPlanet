server:
  port: 8084
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

security:
  token:
    secret: ${TOKEN_SECRET:}
    issuer: xplanet
    expiration-seconds: ${TOKEN_EXPIRE_SECONDS:86400}

spring:
  application:
    name: xplanet-ai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/xplanet?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:root123}
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    password: ${REDIS_PWD:}

rocketmq:
  name-server: ${ROCKETMQ_NS:localhost:9876}
  producer:
    group: xplanet-ai-producer
    send-message-timeout: 3000

ai:
  outbox:
    publish-interval-ms: ${AI_OUTBOX_INTERVAL_MS:500}
    batch-size: ${AI_OUTBOX_BATCH_SIZE:50}
  internal-token: ${AGENT_INTERNAL_TOKEN:${TOKEN_SECRET:}}
  progress:
    max-length: ${AI_PROGRESS_MAX_LENGTH:1000}
    ttl-hours: ${AI_PROGRESS_TTL_HOURS:24}
  agent:
    max-attempts: ${AI_AGENT_MAX_ATTEMPTS:3}

agent-service:
  base-url: ${AGENT_SERVICE_URL:http://localhost:8000}

article-service:
  base-url: ${ARTICLE_SERVICE_URL:http://localhost:8081}

feign:
  client:
    config:
      agent-service:
        connect-timeout: 2000
        read-timeout: 360000
      article-publish-service:
        connect-timeout: 1000
        read-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
