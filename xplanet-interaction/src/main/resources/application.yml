server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

security:
  proxy:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
  token:
    secret: ${TOKEN_SECRET:}
    issuer: xplanet
    expiration-seconds: ${TOKEN_EXPIRE_SECONDS:86400}

spring:
  application:
    name: xplanet-interaction
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/xplanet?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:root123}
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    password: ${REDIS_PWD:}

rocketmq:
  name-server: ${ROCKETMQ_NS:localhost:9876}
  producer:
    group: xplanet-interaction-producer
    send-message-timeout: 3000

like:
  outbox:
    publish-interval-ms: ${LIKE_OUTBOX_INTERVAL_MS:500}
    batch-size: ${LIKE_OUTBOX_BATCH_SIZE:100}

article-service:
  base-url: ${ARTICLE_SERVICE_URL:http://localhost:8081}

feign:
  client:
    config:
      article-service:
        connect-timeout: 1000
        read-timeout: 2000
        logger-level: basic

management:
  endpoints:
    web:
      exposure:
        include: health,info
