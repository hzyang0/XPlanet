server:
  port: 8082

security:
  proxy:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
  token:
    secret: ${TOKEN_SECRET:}
    issuer: xplanet
    expiration-seconds: ${TOKEN_EXPIRE_SECONDS:86400}

spring:
  application:
    name: xplanet-interaction
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    password: ${REDIS_PWD:}

rocketmq:
  name-server: ${ROCKETMQ_NS:localhost:9876}
  producer:
    group: xplanet-interaction-producer
    send-message-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
