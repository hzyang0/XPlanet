services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: xplanet_booking
      MYSQL_USER: booking
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - booking-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -ubooking -e 'SELECT 1' xplanet_booking"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: ../xplanet-booking
    environment:
      DB_URL: jdbc:mysql://mysql:3306/xplanet_booking?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: booking
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
volumes:
  booking-mysql:
