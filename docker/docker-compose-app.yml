# 应用服务(全 Docker 模式)。前提:先起基础设施 docker-compose-infra.yml。
# 用法: docker compose -f docker/docker-compose-app.yml up -d --build
#
# 本 compose 加入基础设施的网络,直接用服务名(mysql/redis/rocketmq-namesrv)互访,
# 不再使用 host.docker.internal。
#
# 注:本地开发更推荐「混合模式」——中间件用 Docker,5 个 Java 服务用 IDE 跑,便于断点调试。
#     全 Docker 模式适合演示 / 部署。

services:
  article:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: xplanet-article
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    container_name: xp-article
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      ROCKETMQ_NS: rocketmq-namesrv:9876
      USER_SERVICE_URL: http://user:8083
      TOKEN_SECRET: ${TOKEN_SECRET}
      TOKEN_EXPIRE_SECONDS: ${TOKEN_EXPIRE_SECONDS:-86400}
      TRUST_FORWARDED_HEADERS: "true"
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
    networks:
      - xp-net

  interaction:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: xplanet-interaction
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    container_name: xp-interaction
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      ROCKETMQ_NS: rocketmq-namesrv:9876
      ARTICLE_SERVICE_URL: http://article:8081
      TOKEN_SECRET: ${TOKEN_SECRET}
      TOKEN_EXPIRE_SECONDS: ${TOKEN_EXPIRE_SECONDS:-86400}
      TRUST_FORWARDED_HEADERS: "true"
    networks:
      - xp-net

  user:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: xplanet-user
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    container_name: xp-user
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      TOKEN_SECRET: ${TOKEN_SECRET}
      TOKEN_EXPIRE_SECONDS: ${TOKEN_EXPIRE_SECONDS:-86400}
      TRUST_FORWARDED_HEADERS: "true"
    networks:
      - xp-net

  agent:
    build:
      context: ..
      dockerfile: xplanet-agent/Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    container_name: xp-agent
    restart: unless-stopped
    environment:
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
      AI_CONTROL_URL: http://ai:8084
      ARTICLE_SERVICE_URL: http://article:8081
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8080}
      AGENT_CRASH_AFTER_NODE: ${AGENT_CRASH_AFTER_NODE:-}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-offline-demo}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    networks:
      - xp-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: xplanet-ai
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    container_name: xp-ai
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      ROCKETMQ_NS: rocketmq-namesrv:9876
      TOKEN_SECRET: ${TOKEN_SECRET}
      TOKEN_EXPIRE_SECONDS: ${TOKEN_EXPIRE_SECONDS:-86400}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
      AGENT_SERVICE_URL: http://agent:8000
      ARTICLE_SERVICE_URL: http://article:8081
      AI_AGENT_MAX_ATTEMPTS: ${AI_AGENT_MAX_ATTEMPTS:-3}
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - xp-net

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        MODULE: xplanet-gateway
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    container_name: xp-gateway
    restart: unless-stopped
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET}
      TOKEN_EXPIRE_SECONDS: ${TOKEN_EXPIRE_SECONDS:-86400}
      USER_SERVICE_URL: http://user:8083
      ARTICLE_SERVICE_URL: http://article:8081
      INTERACTION_SERVICE_URL: http://interaction:8082
      AI_SERVICE_URL: http://ai:8084
      GATEWAY_ALLOWED_ORIGIN_PATTERN: ${GATEWAY_ALLOWED_ORIGIN_PATTERN:-*}
    depends_on:
      - user
      - article
      - interaction
      - ai
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    networks:
      - xp-net

# 复用基础设施 compose 创建的固定网络。
networks:
  xp-net:
    external: true
    name: xplanet-net
