[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "xplanet-agent"
version = "0.1.0"
description = "Traceable research workflow worker for XPlanet"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.1",
    "httpx==0.28.1",
    "langgraph==1.2.9",
    "pydantic==2.13.4",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
